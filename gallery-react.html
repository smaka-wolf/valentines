<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Amor</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Math.js for calculations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --frame-gold: #d4af37;
            --frame-shadow: #8a7020;
            --text-color: #d65a5a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background-image: url('image/gallery/person.jpeg');
            background-position: bottom center;
            background-repeat: no-repeat;
            background-size: contain;
            background-color: #fdf6f6;
        }

        #root {
            width: 100%;
            height: 100%;
        }

        /* GradualBlur Styles */
        .gradual-blur { 
            pointer-events: none; 
            transition: opacity 0.3s ease-out; 
        }
        .gradual-blur-parent { 
            overflow: hidden; 
        }
        .gradual-blur-inner { 
            pointer-events: none; 
            position: relative;
            width: 100%;
            height: 100%;
        }
        .gradual-blur-inner > div {
            -webkit-backdrop-filter: inherit;
            backdrop-filter: inherit;
        }
        .gradual-blur {
            isolation: isolate;
        }
        @supports not (backdrop-filter: blur(1px)) {
            .gradual-blur-inner > div {
                background: rgba(0, 0, 0, 0.3);
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Component added by Ansh - github.com/ansh-dhanani
        
        const { useEffect, useRef, useState, useMemo } = React;

        const DEFAULT_CONFIG = {
            position: 'bottom',
            strength: 2,
            height: '6rem',
            divCount: 5,
            exponential: false,
            zIndex: 1000,
            animated: false,
            duration: '0.3s',
            easing: 'ease-out',
            opacity: 1,
            curve: 'linear',
            responsive: false,
            target: 'parent',
            className: '',
            style: {}
        };

        const PRESETS = {
            top: { position: 'top', height: '6rem' },
            bottom: { position: 'bottom', height: '6rem' },
            left: { position: 'left', height: '6rem' },
            right: { position: 'right', height: '6rem' },
            subtle: { height: '4rem', strength: 1, opacity: 0.8, divCount: 3 },
            intense: { height: '10rem', strength: 4, divCount: 8, exponential: true },
            smooth: { height: '8rem', curve: 'bezier', divCount: 10 },
            sharp: { height: '5rem', curve: 'linear', divCount: 4 },
            header: { position: 'top', height: '8rem', curve: 'ease-out' },
            footer: { position: 'bottom', height: '8rem', curve: 'ease-out' },
            sidebar: { position: 'left', height: '6rem', strength: 2.5 },
            'page-header': { position: 'top', height: '10rem', target: 'page', strength: 3 },
            'page-footer': { position: 'bottom', height: '10rem', target: 'page', strength: 3 }
        };

        const CURVE_FUNCTIONS = {
            linear: p => p,
            bezier: p => p * p * (3 - 2 * p),
            'ease-in': p => p * p,
            'ease-out': p => 1 - Math.pow(1 - p, 2),
            'ease-in-out': p => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2)
        };

        const mergeConfigs = (...configs) => configs.reduce((acc, c) => ({ ...acc, ...c }), {});
        
        const getGradientDirection = position =>
            ({
                top: 'to top',
                bottom: 'to bottom',
                left: 'to left',
                right: 'to right'
            })[position] || 'to bottom';

        const debounce = (fn, wait) => {
            let t;
            return (...a) => {
                clearTimeout(t);
                t = setTimeout(() => fn(...a), wait);
            };
        };

        const useResponsiveDimension = (responsive, config, key) => {
            const [value, setValue] = useState(config[key]);
            useEffect(() => {
                if (!responsive) return;
                const calc = () => {
                    const w = window.innerWidth;
                    let v = config[key];
                    if (w <= 480 && config[`mobile${key[0].toUpperCase() + key.slice(1)}`])
                        v = config[`mobile${key[0].toUpperCase() + key.slice(1)}`];
                    else if (w <= 768 && config[`tablet${key[0].toUpperCase() + key.slice(1)}`])
                        v = config[`tablet${key[0].toUpperCase() + key.slice(1)}`];
                    else if (w <= 1024 && config[`desktop${key[0].toUpperCase() + key.slice(1)}`])
                        v = config[`desktop${key[0].toUpperCase() + key.slice(1)}`];
                    setValue(v);
                };
                const debounced = debounce(calc, 100);
                calc();
                window.addEventListener('resize', debounced);
                return () => window.removeEventListener('resize', debounced);
            }, [responsive, config, key]);
            return responsive ? value : config[key];
        };

        const useIntersectionObserver = (ref, shouldObserve = false) => {
            const [isVisible, setIsVisible] = useState(!shouldObserve);

            useEffect(() => {
                if (!shouldObserve || !ref.current) return;

                const observer = new IntersectionObserver(([entry]) => setIsVisible(entry.isIntersecting), { threshold: 0.1 });

                observer.observe(ref.current);
                return () => observer.disconnect();
            }, [ref, shouldObserve]);

            return isVisible;
        };

        function GradualBlur(props) {
            const containerRef = useRef(null);
            const [isHovered, setIsHovered] = useState(false);

            const config = useMemo(() => {
                const presetConfig = props.preset && PRESETS[props.preset] ? PRESETS[props.preset] : {};
                return mergeConfigs(DEFAULT_CONFIG, presetConfig, props);
            }, [props]);

            const responsiveHeight = useResponsiveDimension(config.responsive, config, 'height');
            const responsiveWidth = useResponsiveDimension(config.responsive, config, 'width');

            const isVisible = useIntersectionObserver(containerRef, config.animated === 'scroll');

            const blurDivs = useMemo(() => {
                const divs = [];
                const increment = 100 / config.divCount;
                const currentStrength =
                    isHovered && config.hoverIntensity ? config.strength * config.hoverIntensity : config.strength;

                const curveFunc = CURVE_FUNCTIONS[config.curve] || CURVE_FUNCTIONS.linear;

                for (let i = 1; i <= config.divCount; i++) {
                    let progress = i / config.divCount;
                    progress = curveFunc(progress);

                    let blurValue;
                    if (config.exponential) {
                        blurValue = Math.pow(2, progress * 4) * 0.0625 * currentStrength;
                    } else {
                        blurValue = 0.0625 * (progress * config.divCount + 1) * currentStrength;
                    }

                    const p1 = Math.round((increment * i - increment) * 10) / 10;
                    const p2 = Math.round(increment * i * 10) / 10;
                    const p3 = Math.round((increment * i + increment) * 10) / 10;
                    const p4 = Math.round((increment * i + increment * 2) * 10) / 10;

                    let gradient = `transparent ${p1}%, black ${p2}%`;
                    if (p3 <= 100) gradient += `, black ${p3}%`;
                    if (p4 <= 100) gradient += `, transparent ${p4}%`;

                    const direction = getGradientDirection(config.position);

                    const divStyle = {
                        position: 'absolute',
                        inset: '0',
                        maskImage: `linear-gradient(${direction}, ${gradient})`,
                        WebkitMaskImage: `linear-gradient(${direction}, ${gradient})`,
                        backdropFilter: `blur(${blurValue.toFixed(3)}rem)`,
                        WebkitBackdropFilter: `blur(${blurValue.toFixed(3)}rem)`,
                        opacity: config.opacity,
                        transition: config.animated && config.animated !== 'scroll'
                            ? `backdrop-filter ${config.duration} ${config.easing}`
                            : undefined
                    };

                    divs.push(<div key={i} style={divStyle} />);
                }

                return divs;
            }, [config, isHovered]);

            const containerStyle = useMemo(() => {
                const isVertical = ['top', 'bottom'].includes(config.position);
                const isHorizontal = ['left', 'right'].includes(config.position);
                const isPageTarget = config.target === 'page';

                const baseStyle = {
                    position: isPageTarget ? 'fixed' : 'absolute',
                    pointerEvents: config.hoverIntensity ? 'auto' : 'none',
                    opacity: isVisible ? 1 : 0,
                    transition: config.animated ? `opacity ${config.duration} ${config.easing}` : undefined,
                    zIndex: isPageTarget ? config.zIndex + 100 : config.zIndex,
                    ...config.style
                };

                if (isVertical) {
                    baseStyle.height = responsiveHeight;
                    baseStyle.width = responsiveWidth || '100%';
                    baseStyle[config.position] = 0;
                    baseStyle.left = 0;
                    baseStyle.right = 0;
                } else if (isHorizontal) {
                    baseStyle.width = responsiveWidth || responsiveHeight;
                    baseStyle.height = '100%';
                    baseStyle[config.position] = 0;
                    baseStyle.top = 0;
                    baseStyle.bottom = 0;
                }

                return baseStyle;
            }, [config, responsiveHeight, responsiveWidth, isVisible]);

            const { hoverIntensity, animated, onAnimationComplete, duration } = config;

            useEffect(() => {
                if (isVisible && animated === 'scroll' && onAnimationComplete) {
                    const ms = parseFloat(duration) * 1000;
                    const t = setTimeout(() => onAnimationComplete(), ms);
                    return () => clearTimeout(t);
                }
            }, [isVisible, animated, onAnimationComplete, duration]);

            return (
                <div
                    ref={containerRef}
                    className={`gradual-blur ${config.target === 'page' ? 'gradual-blur-page' : 'gradual-blur-parent'} ${config.className}`}
                    style={containerStyle}
                    onMouseEnter={hoverIntensity ? () => setIsHovered(true) : undefined}
                    onMouseLeave={hoverIntensity ? () => setIsHovered(false) : undefined}
                >
                    <div
                        className="gradual-blur-inner"
                        style={{
                            position: 'relative',
                            width: '100%',
                            height: '100%'
                        }}
                    >
                        {blurDivs}
                    </div>
                </div>
            );
        }

        // Gallery Component
        function Gallery() {
            const [isPaused, setIsPaused] = useState(false);
            
            const images = [
                "image/imag1.jpeg",
                "image/imag2.jpeg",
                "image/imag3.jpeg",
                "image/imag4.jpeg",
                "image/imag5.jpeg",
                "image/imag6.jpeg",
                "image/imag7.jpeg",
                "image/imag8.jpeg",
                "image/imag9.jpeg",
                "image/imag10.jpeg",
                "image/imag11.jpeg"
            ];

            const totalItems = images.length;
            const radius = 500;

            const carouselStyle = {
                position: 'absolute',
                width: '100%',
                height: '100%',
                transformStyle: 'preserve-3d',
                animation: `rotateCarousel 40s infinite linear`,
                animationPlayState: isPaused ? 'paused' : 'running',
                display: 'flex',
                justifyContent: 'center',
                alignItems: 'center',
                top: '-10%'
            };

            const sceneStyle = {
                position: 'relative',
                width: '100%',
                height: '100vh',
                perspective: '1200px',
                display: 'flex',
                justifyContent: 'center',
                alignItems: 'center',
                overflow: 'hidden'
            };

            const headerStyle = {
                position: 'absolute',
                top: '5%',
                textAlign: 'center',
                zIndex: 30,
                width: '100%',
                pointerEvents: 'none',
                background: 'rgba(255, 255, 255, 0.6)',
                backdropFilter: 'blur(5px)',
                padding: '10px 0',
                borderRadius: '20px'
            };

            const h1Style = {
                fontFamily: "'Dancing Script', cursive",
                fontSize: '4rem',
                color: 'var(--text-color)',
                margin: 0,
                textShadow: '2px 2px 4px rgba(255,255,255,0.8)',
                animation: 'float 3s ease-in-out infinite'
            };

            const pStyle = {
                fontFamily: "'Dancing Script', cursive",
                fontSize: '2.2rem',
                color: '#ffb7b7',
                margin: '5px 0 0 0',
                textShadow: '1px 1px 2px rgba(255,255,255,0.8)'
            };

            const getItemStyle = (index) => {
                const angle = (360 / totalItems) * index;
                return {
                    position: 'absolute',
                    width: '240px',
                    height: '320px',
                    left: '50%',
                    top: '50%',
                    marginLeft: '-120px',
                    marginTop: '-160px',
                    transformStyle: 'preserve-3d',
                    transform: `rotateY(${angle}deg) translateZ(${radius}px)`
                };
            };

            const frameStyle = {
                width: '100%',
                height: '100%',
                background: '#fff',
                border: '10px solid var(--frame-gold)',
                borderRadius: '4px',
                boxShadow: 'inset 0 0 15px rgba(0,0,0,0.3), 0 15px 35px rgba(0,0,0,0.4), 0 0 0 2px var(--frame-shadow)',
                overflow: 'hidden',
                position: 'relative',
                backfaceVisibility: 'hidden'
            };

            const imgStyle = {
                width: '100%',
                height: '100%',
                objectFit: 'cover',
                display: 'block',
                transition: 'transform 0.3s'
            };

            return (
                <div 
                    style={sceneStyle}
                    onMouseEnter={() => setIsPaused(true)}
                    onMouseLeave={() => setIsPaused(false)}
                >
                    {/* GradualBlur at top */}
                    <GradualBlur
                        target="page"
                        position="top"
                        height="8rem"
                        strength={3}
                        divCount={8}
                        curve="bezier"
                        exponential
                        opacity={0.8}
                    />
                    
                    {/* Header Text */}
                    <div style={headerStyle}>
                        <p style={pStyle}>Siempre juntos tú y yo</p>
                        <h1 style={h1Style}>Te amo cada día más 🌹</h1>
                    </div>

                    {/* 3D Rotating Gallery */}
                    <div style={carouselStyle}>
                        {images.map((src, index) => (
                            <div key={index} style={getItemStyle(index)}>
                                <div style={frameStyle}>
                                    <img 
                                        src={src} 
                                        alt="Gallery Photo" 
                                        style={imgStyle}
                                        onMouseEnter={(e) => e.target.style.transform = 'scale(1.1)'}
                                        onMouseLeave={(e) => e.target.style.transform = 'scale(1)'}
                                    />
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    {/* GradualBlur at bottom */}
                    <GradualBlur
                        target="page"
                        position="bottom"
                        height="10rem"
                        strength={3}
                        divCount={8}
                        curve="bezier"
                        exponential
                        opacity={0.9}
                    />
                </div>
            );
        }

        // Main App
        function App() {
            return <Gallery />;
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <style>
        @keyframes rotateCarousel {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.8rem !important; }
            p { font-size: 1.8rem !important; }
            .carousel-item { 
                width: 180px !important; 
                height: 240px !important; 
                margin-left: -90px !important; 
                margin-top: -120px !important; 
            }
            .frame { border-width: 6px !important; }
            body { background-size: 60%; }
        }
    </style>
</body>
</html>
