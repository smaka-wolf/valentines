<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض ذكرياتنا 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            overflow: hidden;
            min-height: 100vh;
            position: relative;
        }
        
        /* Ambient lighting effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 30% 70%, rgba(255, 107, 157, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(196, 69, 105, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 154, 158, 0.1) 0%, transparent 40%);
            z-index: -2;
        }
        
        /* Floating hearts */
        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            animation: float 10s infinite ease-in-out;
            filter: blur(1px);
        }
        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg) scale(0.5); opacity: 0; }
        }
        
        /* Back button */
        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px) scale(1.02);
        }
        
        /* Gallery Title */
        .gallery-title {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Great Vibes', cursive;
            font-size: 42px;
            color: #fff;
            text-shadow: 0 2px 20px rgba(255, 107, 157, 0.5);
            z-index: 100;
            text-align: center;
        }
        
        /* 3D Gallery Container */
        .gallery-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* The rotating carousel */
        .carousel {
            position: relative;
            width: 300px;
            height: 400px;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Gallery Items */
        .gallery-item {
            position: absolute;
            width: 280px;
            height: 380px;
            left: 50%;
            top: 50%;
            margin-left: -140px;
            margin-top: -190px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.2),
                0 0 40px rgba(255, 107, 157, 0.2);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s ease;
            transform-style: preserve-3d;
        }
        
        .gallery-item:hover {
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 0 0 1px rgba(255, 255, 255, 0.3),
                0 0 60px rgba(255, 107, 157, 0.4);
            transform: scale(1.05) translateZ(50px) !important;
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
            transition: all 0.5s ease;
        }
        
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        
        /* Reflection effect */
        .gallery-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
            pointer-events: none;
        }
        
        /* Center Figure */
        .center-figure {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }
        
        .center-figure .figure-icon {
            font-size: 80px;
            filter: drop-shadow(0 10px 30px rgba(255, 107, 157, 0.6));
            animation: pulse-glow 3s infinite ease-in-out;
        }
        
        @keyframes pulse-glow {
            0%, 100% { 
                transform: scale(1); 
                filter: drop-shadow(0 10px 30px rgba(255, 107, 157, 0.6));
            }
            50% { 
                transform: scale(1.1); 
                filter: drop-shadow(0 15px 40px rgba(255, 107, 157, 0.8));
            }
        }
        
        .center-figure .figure-text {
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            color: #fff;
            margin-top: 15px;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
        }
        
        /* Navigation Controls */
        .nav-controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 1000;
        }
        
        .nav-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(255, 107, 157, 0.4);
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        /* Auto-play indicator */
        .auto-play-indicator {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .auto-play-indicator:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .play-icon {
            font-size: 16px;
        }
        
        .auto-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .lightbox-img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            object-fit: contain;
        }
        
        .lightbox-close {
            position: absolute;
            top: -60px;
            right: 0;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1) rotate(90deg);
        }
        
        .lightbox-download {
            font-size: 16px;
            padding: 15px 35px;
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.9), rgba(196, 69, 105, 0.9));
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(196, 69, 105, 0.4);
            font-family: inherit;
        }
        
        .lightbox-download:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 35px rgba(196, 69, 105, 0.5);
        }
        
        /* Floor reflection */
        .floor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
            pointer-events: none;
            z-index: 1;
        }
        
        /* Spotlights */
        .spotlight {
            position: fixed;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 5;
            animation: spotlight-move 8s infinite ease-in-out;
        }
        
        .spotlight-1 {
            top: 20%;
            left: 20%;
            animation-delay: 0s;
        }
        
        .spotlight-2 {
            top: 20%;
            right: 20%;
            animation-delay: 4s;
        }
        
        @keyframes spotlight-move {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            50% { transform: translate(30px, -30px) scale(1.2); opacity: 0.8; }
        }
        
        /* Image counter */
        .image-counter {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            z-index: 100;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .gallery-title {
                font-size: 32px;
                top: 15px;
            }
            
            .carousel {
                width: 250px;
                height: 350px;
            }
            
            .gallery-item {
                width: 230px;
                height: 330px;
                margin-left: -115px;
                margin-top: -165px;
            }
            
            .center-figure .figure-icon {
                font-size: 60px;
            }
            
            .center-figure .figure-text {
                font-size: 22px;
            }
            
            .nav-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating hearts -->
    <div class="hearts" id="hearts"></div>
    
    <!-- Spotlights -->
    <div class="spotlight spotlight-1"></div>
    <div class="spotlight spotlight-2"></div>
    
    <!-- Floor reflection -->
    <div class="floor"></div>
    
    <!-- Back button -->
    <a href="index.html" class="back-btn">↩️ رجوع</a>
    
    <!-- Gallery Title -->
    <h1 class="gallery-title">معرض ذكرياتنا 💕</h1>
    
    <!-- Image counter -->
    <div class="image-counter">
        <span id="current-image">1</span> / <span id="total-images">11</span>
    </div>
    
    <!-- 3D Gallery -->
    <div class="gallery-container">
        <div class="carousel" id="carousel">
            <!-- Gallery items will be generated by JavaScript -->
        </div>
        
        <!-- Center figure -->
        <div class="center-figure">
            <div class="figure-icon">🤵</div>
            <div class="figure-text">حبيبي</div>
        </div>
    </div>
    
    <!-- Navigation controls -->
    <div class="nav-controls">
        <button class="nav-btn" onclick="rotateGallery(-1)">◀</button>
        <button class="nav-btn" onclick="rotateGallery(1)">▶</button>
    </div>
    
    <!-- Auto-play toggle -->
    <div class="auto-play-indicator" onclick="toggleAutoPlay()">
        <span class="play-icon" id="play-icon">⏸</span>
        <span class="auto-text" id="auto-text">تشغيل تلقائي</span>
    </div>
    
    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox(event)">✕</button>
            <img class="lightbox-img" id="lightbox-img" src="" alt="صورة مكبرة">
            <button class="lightbox-download" id="lightbox-download-btn" onclick="downloadCurrentImage()">تحميل الصورة 💾</button>
        </div>
    </div>

    <script>
        // Gallery images
        const images = [
            'image/imag1.jpeg',
            'image/imag2.jpeg',
            'image/imag3.jpeg',
            'image/imag4.jpeg',
            'image/imag5.jpeg',
            'image/imag6.jpeg',
            'image/imag7.jpeg',
            'image/imag8.jpeg',
            'image/imag9.jpeg',
            'image/imag10.jpeg',
            'image/imag11.jpeg'
        ];
        
        let currentIndex = 0;
        let isAutoPlaying = true;
        let autoPlayInterval;
        let currentDownloadUrl = '';
        let currentDownloadFilename = '';
        
        const carousel = document.getElementById('carousel');
        const totalImages = images.length;
        const angleStep = 360 / totalImages;
        const radius = 450; // Distance from center
        
        // Initialize gallery
        function initGallery() {
            // Update total counter
            document.getElementById('total-images').textContent = totalImages;
            
            // Create gallery items
            images.forEach((src, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openLightbox(src, `love-photo-${index + 1}.jpeg`);
                
                const img = document.createElement('img');
                img.src = src;
                img.alt = `صورة ${index + 1}`;
                img.loading = 'lazy';
                
                item.appendChild(img);
                carousel.appendChild(item);
            });
            
            // Position items in 3D circle
            updateGalleryPositions();
            
            // Start auto-play
            startAutoPlay();
        }
        
        // Update 3D positions
        function updateGalleryPositions() {
            const items = document.querySelectorAll('.gallery-item');
            items.forEach((item, index) => {
                const angle = (index * angleStep + currentIndex * angleStep) * (Math.PI / 180);
                const x = Math.sin(angle) * radius;
                const z = Math.cos(angle) * radius - radius; // Offset to bring front items closer
                const rotateY = (index * angleStep + currentIndex * angleStep);
                const scale = (z + radius * 2) / (radius * 2) * 0.4 + 0.6; // Scale based on depth
                
                item.style.transform = `translateX(${x}px) translateZ(${z}px) rotateY(${-rotateY}deg) scale(${scale})`;
                item.style.opacity = scale;
                item.style.zIndex = Math.round(scale * 100);
            });
            
            // Update counter
            const activeIndex = ((-currentIndex % totalImages) + totalImages) % totalImages;
            document.getElementById('current-image').textContent = activeIndex + 1;
        }
        
        // Rotate gallery
        function rotateGallery(direction) {
            currentIndex += direction;
            updateGalleryPositions();
            
            // Reset auto-play timer
            if (isAutoPlaying) {
                stopAutoPlay();
                startAutoPlay();
            }
        }
        
        // Auto-play functions
        function startAutoPlay() {
            autoPlayInterval = setInterval(() => {
                currentIndex--;
                updateGalleryPositions();
            }, 3000);
            document.getElementById('play-icon').textContent = '⏸';
            document.getElementById('auto-text').textContent = 'تشغيل تلقائي';
        }
        
        function stopAutoPlay() {
            clearInterval(autoPlayInterval);
            document.getElementById('play-icon').textContent = '▶';
            document.getElementById('auto-text').textContent = 'توقف مؤقتاً';
        }
        
        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            if (isAutoPlaying) {
                startAutoPlay();
            } else {
                stopAutoPlay();
            }
        }
        
        // Lightbox functions
        function openLightbox(url, filename) {
            currentDownloadUrl = url;
            currentDownloadFilename = filename;
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = url;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            // Pause auto-play when viewing
            if (isAutoPlaying) {
                stopAutoPlay();
            }
        }
        
        function closeLightbox(event) {
            if (event.target.id === 'lightbox' || event.target.classList.contains('lightbox-close')) {
                const lightbox = document.getElementById('lightbox');
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
                
                // Resume auto-play
                if (isAutoPlaying) {
                    startAutoPlay();
                }
            }
        }
        
        function downloadCurrentImage() {
            if (currentDownloadUrl && currentDownloadFilename) {
                const link = document.createElement('a');
                link.href = currentDownloadUrl;
                link.download = currentDownloadFilename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
        
        // Create floating hearts
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = ['❤️', '💖', '💕', '💗', '💝'][Math.floor(Math.random() * 5)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 10 + 's';
                heart.style.animationDuration = (8 + Math.random() * 6) + 's';
                heartsContainer.appendChild(heart);
            }
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                rotateGallery(-1);
            } else if (e.key === 'ArrowRight') {
                rotateGallery(1);
            } else if (e.key === 'Escape') {
                const lightbox = document.getElementById('lightbox');
                if (lightbox.classList.contains('active')) {
                    lightbox.classList.remove('active');
                    document.body.style.overflow = '';
                    if (isAutoPlaying) startAutoPlay();
                }
            }
        });
        
        // Touch/swipe support for mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        
        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });
        
        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    rotateGallery(1); // Swipe left, go next
                } else {
                    rotateGallery(-1); // Swipe right, go previous
                }
            }
        }
        
        // Initialize
        createHearts();
        initGallery();
        
        // Pause on hover over gallery
        carousel.addEventListener('mouseenter', () => {
            if (isAutoPlaying) stopAutoPlay();
        });
        
        carousel.addEventListener('mouseleave', () => {
            if (isAutoPlaying) startAutoPlay();
        });
    </script>
</body>
</html>
