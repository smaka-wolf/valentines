Html<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Love Story</title>
    <style>
      /* Reset some default styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #fff5f7;
        color: #333;
        line-height: 1.6;
      }

      header {
        background: linear-gradient(135deg, #ff7eb3, #ff758c);
        color: white;
        text-align: center;
        padding: 2rem 1rem;
      }

      header h1 {
        font-size: 2.5rem;
      }

      nav {
        background-color: #ffb3c6;
        padding: 0.5rem;
        text-align: center;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin: 0 1rem;
        font-weight: bold;
      }

      nav a:hover {
        text-decoration: underline;
      }

      section {
        padding: 2rem;
        max-width: 900px;
        margin: auto;
      }

      .story {
        background: white;
        padding: 1.5rem;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 2rem;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
      }

      .gallery img {
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      footer {
        background-color: #ff758c;
        color: white;
        text-align: center;
        padding: 1rem;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>John ❤️ Emma</h1>
      <p>Our Journey Together</p>
    </header>

    <nav>
      <a href="index.html">Our Story</a>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
      <a href="valantaine.html">valantaine day</a>
    </nav>

    <section id="gallery">
      <h2 style="text-align: center; margin-bottom: 1rem">Gallery</h2>
      <div class="gallery">
        <img
          src="https://via.placeholder.com/400x300?text=Memory+1"
          alt="Memory 1"
        />
        <img
          src="https://via.placeholder.com/400x300?text=Memory+2"
          alt="Memory 2"
        />
        <img
          src="https://via.placeholder.com/400x300?text=Memory+3"
          alt="Memory 3"
        />
        <img
          src="https://via.placeholder.com/400x300?text=Memory+4"
          alt="Memory 4"
        />
      </div>
    </section>

    <footer>
      <p>© تم تطوير الموقع بواسطة : OUSSAMA SMAKA WOLF</p>
    </footer>
  </body>
</html>
