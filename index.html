<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Love Story</title>
    <style>
      /* Reset some default styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #fff5f7;
        color: #333;
        line-height: 1.6;
      }

      header {
        background: linear-gradient(135deg, #ff7eb3, #ff758c);
        color: white;
        text-align: center;
        padding: 2rem 1rem;
      }

      header h1 {
        font-size: 2.5rem;
      }

      nav {
        background-color: #ffb3c6;
        padding: 0.5rem;
        text-align: center;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin: 0 1rem;
        font-weight: bold;
      }

      nav a:hover {
        text-decoration: underline;
      }

      section {
        padding: 2rem;
        max-width: 900px;
        margin: auto;
      }

      .story {
        background: white;
        padding: 1.5rem;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 2rem;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
      }

      .gallery img {
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      footer {
        background-color: #ff758c;
        color: white;
        text-align: center;
        padding: 1rem;
        margin-top: 2rem;
      }

      /* Love Counter Header */
      .love-counter-header {
        background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ffd1ff);
        padding: 20px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }

      .counter-title {
        font-family: 'Great Vibes', cursive;
        font-size: 28px;
        color: #fff;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        margin-bottom: 15px;
      }

      .counter-units {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
      }

      .counter-unit {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 15px;
        padding: 12px 18px;
        min-width: 70px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .counter-value {
        font-family: 'Dancing Script', cursive;
        font-size: 32px;
        font-weight: 700;
        color: #fdfbfb;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        display: block;
      }

      .counter-label {
        font-size: 15px;
        color: rgba(14, 14, 14, 0.9);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 5px;
        display: block;
      }

      .counter-separator {
        font-size: 24px;
        color: rgba(255, 255, 255, 0.8);
        font-weight: bold;
      }
    </style>

  </head>
  <body>
    <!-- Authentication Check - Redirect to loading if not authenticated -->
    <script>
      // Check if user came from loading page
      if (sessionStorage.getItem("authenticated") !== "true") {
        // Not authenticated, redirect to loading page
        window.location.href = "loading.html";
      }
      // Note: We keep the authentication flag so navigation to other pages works
      // The flag will be cleared when browser session ends
    </script>

    <header>
        <!-- Love Counter Header -->
    <div class="love-counter-header" id="love-counter-header">
       <h1>OUS
        AMA ❤️ HAYAT</h1>
      <div class="counter-title">💕 حبنا منذ 24 مارس 2016 💕</div>
      <div class="counter-units">
        <div class="counter-unit">
          <span class="counter-value" id="years">0</span>
          <span class="counter-label">سنة</span>
        </div>
        <span class="counter-separator">:</span>
        <div class="counter-unit">
          <span class="counter-value" id="months">0</span>
          <span class="counter-label">شهر</span>
        </div>
        <span class="counter-separator">:</span>
        <div class="counter-unit">
          <span class="counter-value" id="days">0</span>
          <span class="counter-label">يوم</span>
        </div>
        <span class="counter-separator">:</span>
        <div class="counter-unit">
          <span class="counter-value" id="hours">0</span>
          <span class="counter-label">ساعة</span>
        </div>
        <span class="counter-separator">:</span>
        <div class="counter-unit">
          <span class="counter-value" id="minutes">0</span>
          <span class="counter-label">دقيقة</span>
        </div>
        <span class="counter-separator">:</span>
        <div class="counter-unit">
          <span class="counter-value" id="seconds">0</span>
          <span class="counter-label">ثانية</span>
        </div>
      </div>
    </div>
     
    </header>

    <nav>
      <a href="">Our Story</a>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
      <a href="valantaine.html">valantaine day</a>
    </nav>

    <section id="gallery">
      <h2 style="text-align: center; margin-bottom: 1rem">Gallery</h2>
      <div class="gallery">
        <img
          src="https://via.placeholder.com/400x300?text=Memory+1"
          alt="Memory 1"
        />
        <img
          src="https://via.placeholder.com/400x300?text=Memory+2"
          alt="Memory 2"
        />
        <img
          src="https://via.placeholder.com/400x300?text=Memory+3"
          alt="Memory 3"
        />
        <img
          src="https://via.placeholder.com/400x300?text=Memory+4"
          alt="Memory 4"
        />
      </div>
    </section>

    <footer>
      <p>© تم تطوير الموقع بواسطة : OUSSAMA SMAKA WOLF</p>
    </footer>

    <script>
      // Love Counter Functionality
      function updateLoveCounter() {
        const startDate = new Date('2016-03-24T00:00:00');
        const now = new Date();
        
        let years = now.getFullYear() - startDate.getFullYear();
        let months = now.getMonth() - startDate.getMonth();
        let days = now.getDate() - startDate.getDate();
        let hours = now.getHours() - startDate.getHours();
        let minutes = now.getMinutes() - startDate.getMinutes();
        let seconds = now.getSeconds() - startDate.getSeconds();
        
        // Adjust for negative values
        if (seconds < 0) {
          seconds += 60;
          minutes--;
        }
        if (minutes < 0) {
          minutes += 60;
          hours--;
        }
        if (hours < 0) {
          hours += 24;
          days--;
        }
        if (days < 0) {
          const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
          days += prevMonth.getDate();
          months--;
        }
        if (months < 0) {
          months += 12;
          years--;
        }
        
        // Update DOM
        document.getElementById('years').textContent = years;
        document.getElementById('months').textContent = months;
        document.getElementById('days').textContent = days;
        document.getElementById('hours').textContent = hours;
        document.getElementById('minutes').textContent = minutes;
        document.getElementById('seconds').textContent = seconds;
      }
      
      // Start the counter
      updateLoveCounter();
      setInterval(updateLoveCounter, 1000);
    </script>
  </body>

</html>
